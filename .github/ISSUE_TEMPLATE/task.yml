name: 작업
description: 기능, 리팩터링, 문서, 인프라 작업을 등록합니다.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        작업 범위를 작게 유지하고, 한 명이 끝까지 책임질 수 있는 단위로 작성해주세요.

  - type: dropdown
    id: release
    attributes:
      label: 출시 단계
      options:
        - MVP
        - Post Launch
      description: 1차 출시에 반드시 필요한 작업인지 선택해주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - Backend
        - Frontend
        - Infra / CI/CD
        - Documentation
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업이 필요한 이유와 기대 결과를 적어주세요.
      placeholder: 사용자가 승인 대기 상태를 확인하고 로그아웃할 수 있다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 내용
      description: 구현할 내용을 체크리스트로 적어주세요.
      placeholder: |
        - [ ] API 구현
        - [ ] 테스트 추가
        - [ ] Swagger/OpenAPI 갱신
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 리뷰어가 완료 여부를 확인할 수 있는 결과를 적어주세요.
      placeholder: |
        - PENDING 사용자는 승인 대기 화면만 접근할 수 있다.
        - 일반 API 요청은 403 PENDING_APPROVAL을 반환한다.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 이 이슈에서 하지 않을 일을 적어 범위가 커지는 것을 막습니다.
      placeholder: 비밀번호 재설정, 이메일 인증

  - type: textarea
    id: dependencies
    attributes:
      label: 의존성·참고 자료
      description: 선행 이슈, 관련 스펙, API 문서 링크를 적어주세요.
      placeholder: "#12, spec/3-1-DESIGN-ARCHITECTURE.md"
