name: Lint PR title

# 일반 작업과 release PR 모두 CONTRIBUTING.md의 제목 형식을 따른다.
# squash merge에서는 PR 제목이 그대로 커밋 메시지가 된다.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            design
            cicd
            refactor
            test
            chore
          # scope는 쓰지 않는다 (CONTRIBUTING.md 1절)
          requireScope: false
          disallowScopes: |
            *
