name: CI

# PR마다 API 테스트, Web 린트·빌드를 돌린다 (docs/ops/deployment.md).
# apps/api의 통합 테스트는 Testcontainers가 자체적으로 Postgres 컨테이너를 띄우므로
# 별도 postgres 서비스 컨테이너는 두지 않는다 — ubuntu-latest 러너는 Docker를 기본 제공한다.

on:
  pull_request:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - working-directory: apps/api
        run: ./gradlew build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
