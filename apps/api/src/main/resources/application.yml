spring:
  application:
    name: hacker-hp-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 프록시가 두 겹이라(Vercel → ALB) Spring이 요청 host로 조립한 redirect_uri는
            # 구글 등록값과 어긋난다. 환경별 절대 URI로 고정한다 (docs/ops/infra.md).
            redirect-uri: ${OAUTH_REDIRECT_URI}
            scope:
              - openid
              - email
              - profile
  data:
    web:
      pageable:
        # 계약의 공통 페이지 파라미터 (3-2 §3-2-8). page는 0부터 시작한다.
        default-page-size: 20
        # 기본 상한은 2000이다. 그대로 두면 관리자 한 명이 전 회원을 한 번에 긁을 수 있고,
        # 화면이 쓰지도 않는 크기라 얻는 것도 없다. 넘는 값은 이 값으로 잘린다.
        max-page-size: 100
        # Page를 그대로 직렬화하지 않는다 (3-2 §3-2-8 MUST). 내부 구현 필드(pageable·sort·
        # offset)가 응답에 새는 것을 막고 계약이 정한 PagedModel 형태로 내보낸다.
        #
        # @EnableSpringDataWebSupport(pageSerializationMode = VIA_DTO)와 같은 설정이지만
        # 애너테이션을 쓰면 안 된다 — 그것을 붙이는 순간 Boot의 자동설정이 통째로 물러나
        # 바로 위의 default-page-size·max-page-size가 조용히 무시된다.
        serialization-mode: via-dto
  session:
    # 세션은 RDS에 둔다 (3-1 §3-1-5 MUST).
    store-type: jdbc
    jdbc:
      # 스키마는 Flyway(V2__session.sql)가 만든다. 둘 다 만들려 들면 기동이 실패한다.
      initialize-schema: never

server:
  tomcat:
    # 로그인 리다이렉트를 상대 경로 그대로 내보낸다 (3-2 §3-2-3 MUST).
    #
    # 로그인 성공·실패 핸들러는 SPA의 라우트(`/`, `/login?error=...`)를 상대 경로로 준다. 끄면
    # Tomcat이 그것을 요청 Host로 절대화하는데, 이 API는 언제나 프록시 뒤에 있고 프록시가 Host를
    # API 오리진으로 바꾼다(로컬은 Vite의 changeOrigin, 운영은 Vercel rewrites → ALB). 그러면
    # 브라우저가 SPA를 떠나 API 서버로 이동해 화면 대신 JSON을 본다 — 로그인에 성공해도 그렇다.
    #
    # 위의 redirect-uri를 환경별 절대 URI로 고정한 것과 같은 이유이고, 같은 함정의 다른 자리다.
    use-relative-redirects: true
  servlet:
    session:
      # JWT 수명(app.auth.jwt.expiry)과 같은 값이다. 세션이 없으면 토큰이 살아 있어도 인증이
      # 성립하지 않으므로(3-3 결정 12) 토큰만 더 오래 살려 둘 이유가 없다.
      timeout: 30m
      cookie:
        http-only: true
        # 3-1 §3-1-5 MUST. SameSite=Lax는 교차 사이트 요청만 제한할 뿐 평문 전송을 막지 못한다.
        # 로컬(HTTP)만 application-local.yml에서 예외를 둔다.
        secure: true
        same-site: lax

app:
  auth:
    # 값이 없으면 기동에 실패한다. 기본값을 심어두면 설정 누락이 조용히 지나가고
    # 도메인 제한이 무력해진다 (docs/ops/infra.md, 3-1 §3-1-4).
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:}
    jwt:
      # 기본값을 심으면 누구나 아는 키로 토큰을 위조할 수 있다. 운영 값은 SSM에 있다.
      secret: ${JWT_SECRET:}
      expiry: 30m
    bootstrap:
      # 최초 관리자 승격에 쓰는 값 (3-3 결정 11). 운영 값은 SSM에 있고 태스크 정의가
      # secrets로 항상 주입한다 (docs/ops/infra.md).
      #
      # 위 둘과 달리 없어도 기동한다. 일회성 운영 경로를 기동 조건으로 묶으면 로컬·테스트가
      # 이 값을 채워야만 뜨는데, 그 대가로 얻는 것이 없다 — 값이 없으면 그 경로만 닫히고
      # 무방비가 되지도 않는다.
      #
      # 토큰 회전은 파라미터를 지우는 것이 아니라 값만 바꾸고 재배포하는 것이다. 지우면
      # secrets 주입이 실패해 새 태스크가 뜨지 못한다 (docs/ops/runbook.md).
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      token: ${ADMIN_BOOTSTRAP_TOKEN:}

  storage:
    # 자료·사진이 들어가는 버킷. 태스크 정의가 S3_BUCKET으로 항상 주입한다
    # (infra/terraform/ecs.tf). 기본값을 심으면 설정 누락이 조용히 지나가고
    # 업로드가 엉뚱한 버킷을 가리킨다.
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    # 발급한 URL의 수명. 20MB를 올리기엔 충분하고, 새어나가도 창이 좁다.
    # 만료되면 다시 발급받으면 된다.
    presign-ttl: 5m
  notes:
    upload:
      # 2-1 §2-1-2 MUST — "허용 확장자와 최대 용량은 설정값으로 제한한다".
      # hwp를 더 받거나 상한을 늘리는 일은 배포가 아니라 설정으로 끝나야 한다.
      allowed-extensions: [pdf, docx, pptx, hwp, zip, png, jpg]
      max-file-size: 20MB
      max-file-count: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
