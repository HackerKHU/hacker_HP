spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hacker
    username: hacker
    password: localdev
  security:
    oauth2:
      client:
        registration:
          google:
            # 값은 각자 .env나 실행 환경변수로 넣는다. 저장소에 적지 않는다.
            # 로컬용 클라이언트는 운영용과 따로 만든다 (#82) — 로컬 시크릿이 새도 운영은 무사하다.
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # 브라우저 기준 오리진은 Vite dev 서버(5173)다. /api는 프록시가 8080으로 넘긴다.
            redirect-uri: http://localhost:5173/api/v1/login/oauth2/code/google

server:
  servlet:
    session:
      cookie:
        # 로컬은 HTTP다. Secure를 켜면 브라우저가 쿠키를 저장하지 않아 로그인이 성립하지 않는다.
        secure: false

app:
  auth:
    allowed-email-domain: khu.ac.kr
