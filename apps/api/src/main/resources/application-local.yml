spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hacker
    username: hacker
    password: localdev
  security:
    oauth2:
      client:
        registration:
          google:
            # 값은 각자 .env나 실행 환경변수로 넣는다. 저장소에 적지 않는다.
            # 로컬용 클라이언트는 운영용과 따로 만든다 (#82) — 로컬 시크릿이 새도 운영은 무사하다.
            #
            # 기본값이 빈 문자열이면 안 된다. Spring Boot가 "Client id of registration 'google'
            # must not be empty."로 컨텍스트를 통째로 죽인다. 서버를 띄워 헬스체크나 다른 API를
            # 보려는 사람에게까지 구글 자격을 요구하게 되므로, 자리를 채우는 가짜 값을 둔다.
            # 이 값으로 로그인을 시도하면 구글이 거부한다 — 시크릿이 아니다.
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-set}
            # 브라우저 기준 오리진은 Vite dev 서버(5173)다. /api는 프록시가 8080으로 넘긴다.
            redirect-uri: http://localhost:5173/api/v1/login/oauth2/code/google

server:
  servlet:
    session:
      cookie:
        # 로컬은 HTTP다. Secure를 켜면 브라우저가 쿠키를 저장하지 않아 로그인이 성립하지 않는다.
        secure: false

app:
  auth:
    allowed-email-domain: khu.ac.kr
    jwt:
      # 로컬 전용 고정값이다. 로컬 DB 비밀번호와 같은 취급 — 저장소에 있는 순간 비밀이 아니므로
      # 운영에서는 절대 쓰지 않는다. 운영 값은 SSM의 /hacker/dev/JWT_SECRET에서 온다.
      # HS256은 32바이트 이상을 요구한다.
      secret: local-development-only-jwt-secret-do-not-use-in-production
  storage:
    # docker-compose.yml의 MinIO를 가리킨다 (#213 통합 — 원래 사진만 이 값을 썼다). 기본
    # 자격 증명(minioadmin)은 로컬 전용이라 비밀로 치지 않는다.
    #
    # 자료(#207)는 바이트를 만지지 않으므로 이 버킷이 없어도(MinIO를 안 띄워도) 기동은 된다 —
    # presigned PUT 발급 자체는 실제 버킷 존재 여부를 확인하지 않는다. 활동사진(#57)은 서버가
    # 원본을 내려받아 리사이즈하므로 실제로 MinIO가 떠 있어야 등록이 성공한다.
    #
    # 진짜 AWS S3를 보려면 이 블록을 지우고 S3_BUCKET·AWS_REGION과 ECS Task Role에 준하는
    # 자격증명을 환경변수로 넣는다.
    bucket: hacker-uploads-local
    region: ap-northeast-2
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
